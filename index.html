function toast(msg){let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),3500)}
function field(label,key,value,type='input'){return `<label for="field-${key}">${label}</label><${type} id="field-${key}" name="${key}" ${type==='input'?`value="${esc(value)}"`:''}>${type==='textarea'?esc(value):''}${type==='textarea'?'</textarea>':''}`}
function openEditor(selected='site'){document.getElementById('editor').innerHTML=`<div class="overlay"><section class="panel" role="dialog" aria-modal="true" aria-label="Edit portfolio"><header><h2>Your portfolio studio</h2><button class="close" onclick="closeEditor()" aria-label="Close editor">×</button></header><p class="note">Edits are saved in this browser. Export your finished website to keep a complete copy. Updating the hosted version requires a new deployment.</p><label>Edit section</label><select id="editSelect"><option value="site">Site introduction & contact</option>${data.projects.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.title)}${p.hidden?' (hidden)':''}</option>`).join('')}</select><form id="editForm"></form><div class="actions"><button class="btn secondary" onclick="downloadSite()">Export website</button><button class="btn secondary" onclick="exportData()">Back up content</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Import content</button><input id="importFile" type="file" accept="application/json" hidden></div></section></div>`;document.getElementById('editSelect').onchange=e=>editFields(e.target.value);document.getElementById('importFile').onchange=importData;editFields(selected);document.querySelector('.close').focus()}
function closeEditor(){document.getElementById('editor').innerHTML=''}
function editFields(id){let p=data.projects.find(p=>p.id===id);let f=document.getElementById('editForm');f.innerHTML=p?field('Company name','title',p.title)+field('One-sentence description','description',p.description,'textarea')+field('Tags (comma separated)','tags',p.tags.join(', '))+field('My role','role',p.role)+field('Detailed scope','scope',p.scope,'textarea')+field('Recognition','recognition',p.recognition,'textarea')+field('Cover image URL','cover',p.cover)+'<label for="coverFile">Or upload a cover image</label><input type="file" id="coverFile" accept="image/png,image/jpeg,image/webp">'+`<label><input style="width:auto" type="checkbox" name="hidden" ${p.hidden?'checked':''}> Hide this company</label><div class="row"><button type="button" class="btn secondary" onclick="moveProject('${p.id}',-1)">Move earlier ↑</button><button type="button" class="btn secondary" onclick="moveProject('${p.id}',1)">Move later ↓</button></div>`+p.cases.map((c,i)=>`<fieldset><legend>Project ${i+1}</legend>${field('Title','case_'+i+'_title',c.title)}${field('My contribution','case_'+i+'_contribution',c.contribution,'textarea')}${field('Tools','case_'+i+'_tools',c.tools)}${field('Outcome','case_'+i+'_outcome',c.outcome,'textarea')}${field('Credits','case_'+i+'_credits',c.credits)}${field('Media: one image, YouTube, Vimeo or MP4 URL per line','case_'+i+'_media',c.media,'textarea')}<label for="gallery-${i}">Or upload images</label><input id="gallery-${i}" data-gallery="${i}" type="file" multiple accept="image/png,image/jpeg,image/webp"></fieldset>`).join(''):field('Name','name',data.name)+field('Headline (two lines)','headline',data.headline,'textarea')+field('Introduction','intro',data.intro,'textarea')+field('Portfolio focus','focus',data.focus,'textarea')+field('Contact email','email',data.email);f.innerHTML+='<div class="actions"><button class="btn" type="submit">Save changes</button><button class="btn secondary" type="button" onclick="closeEditor()">Done</button></div>';f.onsubmit=e=>{e.preventDefault();let vals=Object.fromEntries(new FormData(f));if(p){for(let key of ['title','description','role','scope','recognition','cover'])p[key]=vals[key];p.tags=vals.tags.split(',').map(x=>x.trim()).filter(Boolean);p.hidden=!!vals.hidden;p.cases.forEach((c,i)=>{for(let key of ['title','contribution','tools','outcome','credits','media'])c[key]=vals['case_'+i+'_'+key]})}else Object.assign(data,vals);save();render()};if(p){document.getElementById('coverFile').onchange=async e=>{if(e.target.files[0])f.elements.cover.value=await readImage(e.target.files[0])};f.querySelectorAll('[data-gallery]').forEach(input=>{input.onchange=async e=>{let target=f.elements['case_'+input.dataset.gallery+'_media'];for(let file of e.target.files)target.value+='\n'+await readImage(file)}})}}
function readImage(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),ratio=Math.min(1,1800/img.width);c.width=img.width*ratio;c.height=img.height*ratio;c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.85))};img.onerror=()=>{toast('Could not read image');reject()};img.src=r.result};r.readAsDataURL(file)})}
function save(){try{localStorage.setItem('nazar-portfolio-v2',JSON.stringify(data));toast('Draft saved in this browser')}catch(e){toast('Browser storage is full. Export your website to keep these changes.')}}
function moveProject(id,dir){let i=data.projects.findIndex(p=>p.id===id),j=i+dir;if(j<0||j>=data.projects.length)return;[data.projects[i],data.projects[j]]=[data.projects[j],data.projects[i]];save();render();openEditor(id)}
function download(text,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportData(){download(JSON.stringify(data,null,2),'portfolio-content.json','application/json')}
async function importData(e){try{let d=JSON.parse(await e.target.files[0].text());if(!d.name||!Array.isArray(d.projects)||!d.projects.every(p=>typeof p.id==='string'&&Array.isArray(p.tags)&&Array.isArray(p.cases)&&p.cases.every(c=>typeof c.media==='string')))throw Error();data=d;save();render();openEditor()}catch(e){toast('Choose a valid portfolio content backup.')}}
function downloadSite(){let clone=document.documentElement.cloneNode(true);clone.querySelector('#editor').innerHTML='';clone.querySelector('#portfolio-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');clone.querySelectorAll('.toast,.lightbox').forEach(e=>e.remove());download('<!doctype html>\n'+clone.outerHTML,'index.html','text/html');toast('Website exported with your saved content')}
window.addEventListener('hashchange',()=>{render();if(location.hash.startsWith('#project/')&&location.hash.split('/').length===2)window.scrollTo(0,0)});document.addEventListener('click',e=>{let b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeEditor();document.querySelector('.lightbox')?.remove()}});render();
</script></body></html>
